name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/LinkedInStudio/LinkedInStudio.csproj

      - name: Build
        run: dotnet build src/LinkedInStudio/LinkedInStudio.csproj -c Release --no-restore
